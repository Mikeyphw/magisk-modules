name: Approve current installers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magisk-installer-approval
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder fork
        uses: actions/checkout@v4
        with:
          path: repository

      - name: Checkout latest upstream
        uses: actions/checkout@v4
        with:
          repository: bnsmb/magisk-modules
          ref: main
          path: upstream
          sparse-checkout: |
            Magisk_Modules
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Test builder
        working-directory: repository
        run: python3 -m unittest discover -s .bundle-builder/tests -v

      - name: Record current installer surfaces
        working-directory: repository
        run: |
          upstream_commit="$(git -C ../upstream rev-parse HEAD)"
          upstream_committed_at="$(
            git -C ../upstream show -s --format=%cI HEAD
          )"

          python3 .bundle-builder/build_bundle.py \
            --config bundle.toml \
            --lock bundle-installer-lock.json \
            --write-lock bundle-installer-lock.json \
            --upstream ../upstream/Magisk_Modules \
            --output-dir dist \
            --upstream-commit "$upstream_commit" \
            --upstream-committed-at "$upstream_committed_at"

      - name: Commit approval
        working-directory: repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add bundle-installer-lock.json
          if git diff --cached --quiet; then
            echo "Installer lock is already current."
            exit 0
          fi

          git commit -m "Approve current upstream installer surfaces"
          git push origin HEAD:main

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: approved-installer-audit
          path: |
            repository/dist/audit-report.json
            repository/dist/provenance.json
          if-no-files-found: error
